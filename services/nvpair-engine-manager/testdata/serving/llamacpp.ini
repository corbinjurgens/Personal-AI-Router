[*]
fit = off
load-on-startup = false

[medium]
model = medium.gguf
ctx-size = 16384
parallel = 2
kv-unified = false
gpu-layers = 12
tensor-split = 3,1
sleep-idle-seconds = 180

[weak]
model = weak.gguf
ctx-size = 4096
parallel = 1
kv-unified = true
kv-unified-per-slot = 2048
gpu-layers = 5
sleep-idle-seconds = 60
